name: Sooners daily brief

on:
  schedule:
    # 07:05 America/Denver. 13:05 UTC is 07:05 MDT. 14:05 UTC is 07:05 MST.
    # The gate keeps hours 07 and 08 so a delayed cron still runs.
    # A later run no-ops when main already has the day, or squash-merges the
    # open sooners-daily/YYYY-MM-DD pull request instead of opening another.
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "America/Chicago folder date YYYY-MM-DD. Empty uses Chicago today."
        required: false
        type: string
        default: ""
      commit:
        description: "Open a pull request and squash-merge the day folder. Leave false for a dry run."
        required: false
        type: boolean
        default: false

# contents: write pushes the day branch and squash-merges it.
# pull-requests: write opens that pull request. main is never pushed to.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sooners-daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a committing run that is not on main
        if: github.event_name == 'workflow_dispatch' && inputs.commit && github.ref != 'refs/heads/main'
        run: |
          echo "A committing Sooners run is only allowed on main."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate scheduled runs to 7 or 8 AM America/Denver
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(TZ=America/Denver date +%H)
            decision=$(python Sooners/scripts/denver_gate.py "$hour" schedule)
            if [ "$decision" = "skip" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Denver hour is ${hour}. Scheduled runs proceed during 07 and 08."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Generate the Chicago brief when this date still needs one
        id: gen
        if: steps.gate.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python Sooners/scripts/run_daily.py generate

      # A pull request opened with GITHUB_TOKEN does not start other workflows.
      # main's ruleset has no required checks. These guards still run here,
      # before merge, and they are not a ruleset change.
      - name: Run Sooners guards in this job
        if: steps.gate.outputs.skip != 'true' && steps.gen.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s Sooners/tests -v
          python Sooners/scripts/prove_accuracy_red.py

      - name: Push the day branch and squash-merge the pull request
        if: steps.gate.outputs.skip != 'true' && steps.gen.outputs.publish == 'true'
        env:
          FOLDER_DATE: ${{ steps.gen.outputs.folder_date }}
          PUBLISH_ACTION: ${{ steps.gen.outputs.action }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python Sooners/scripts/run_daily.py publish
